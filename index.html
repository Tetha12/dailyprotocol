};

const RoadmapMgr = ({ roadmap, setRoadmap }) => {
  const [sel, setSel] = useState(null); const [editPhase, setEditPhase] = useState(null); const [editItem, setEditItem] = useState(null); const [draggedIdx, setDraggedIdx] = useState(null); const [confirmDialog, setConfirmDialog] = useState(null);
  const safeRM = Array.isArray(roadmap) ? roadmap : DEFAULT_ROADMAP;
  const phase = safeRM.find(p => p.id === sel);

  const savePhase = d => {
    if (d.isNew) { const np = { id: `ph_${Date.now()}`, title: d.title, week: d.week, desc: d.desc, color: d.color || '#3b82f6', pl: d.pl, videos: [], casestudies: [] }; setRoadmap(p => [...(Array.isArray(p) ? p : DEFAULT_ROADMAP), np]); } 
    else { setRoadmap(p => (Array.isArray(p) ? p : DEFAULT_ROADMAP).map(x => x.id === d.id ? { ...x, ...d } : x)); }
    setEditPhase(null);
  };
  const delPhase = id => { setConfirmDialog({ type: 'delete_phase', id, title: 'Hapus Modul?', desc: 'Modul ini akan dihapus secara permanen.' }); };
  const execDelPhase = id => { setRoadmap(p => (Array.isArray(p) ? p : DEFAULT_ROADMAP).filter(x => x.id !== id)); if (sel === id) setSel(null); setConfirmDialog(null); };
  
  const movePhase = (idx, direction) => {
    const newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= safeRM.length) return;
    setRoadmap(p => {
      const arr = Array.isArray(p) ? [...p] : [...DEFAULT_ROADMAP];
      [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
      return arr;
    });
  };
  
  const onDragStart = (e, idx) => { e.dataTransfer.effectAllowed = 'move'; setDraggedIdx(idx); };
  const onDragOver = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
  const onDrop = (e, targetIdx) => {
    e.preventDefault();
    if (draggedIdx === null || draggedIdx === targetIdx) return;
    setRoadmap(p => {
      const arr = Array.isArray(p) ? [...p] : [...DEFAULT_ROADMAP];
      const [item] = arr.splice(draggedIdx, 1);
      arr.splice(targetIdx, 0, item);
      return arr;
    });
    setDraggedIdx(null);
  };
  
  const saveItem = data => {
    setRoadmap(p => (Array.isArray(p) ? p : DEFAULT_ROADMAP).map(ph => {
      if (ph.id !== sel) return ph;
      
      if (data.isBulk) {
        const newVideos = [];
        const newCases = [];
        (data.bulkItems || []).forEach(item => {
            const id = `${item.type === 'video' ? 'v' : 'cs'}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
            if (item.type === 'video') newVideos.push({ id, title: item.title || 'Video Tanpa Judul', url: item.url || '' });
            else newCases.push({ id, title: item.title || 'Project Tanpa Judul', desc: item.desc || '' });
        });
        return { ...ph, videos: [...(ph.videos || []), ...newVideos], casestudies: [...(ph.casestudies || []), ...newCases] };
      }

      const key = data.type === 'video' ? 'videos' : 'casestudies';
      const list = [...(ph[key] || [])];
      const item = data.type === 'video' ? { id: data.id || `v_${Date.now()}`, title: data.title, url: data.url || '' } : { id: data.id || `cs_${Date.now()}`, title: data.title, desc: data.desc || '' };
      if (data.isNew) list.push(item); else list[data.index] = item;
      return { ...ph, [key]: list };
    }));
    setEditItem(null);
  };

  const delItem = (type, index) => { setConfirmDialog({ type: 'delete_item', itemType: type, index, title: 'Hapus Item?', desc: 'Item ini akan dihapus secara permanen.' }); };
  const execDelItem = (type, index) => { setRoadmap(p => (Array.isArray(p) ? p : DEFAULT_ROADMAP).map(ph => { if (ph.id !== sel) return ph; const key = type === 'video' ? 'videos' : 'casestudies'; const list = [...(ph[key] || [])]; list.splice(index, 1); return { ...ph, [key]: list }; })); setConfirmDialog(null); };

  return (
    <div style={{ display: 'grid', gridTemplateColumns: sel ? '240px 1fr' : '1fr', gap: 20, minHeight: 400 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div className="between" style={{ marginBottom: 8 }}><span style={{ fontSize: 12, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Modul IT</span><button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => setEditPhase({ isNew: true, title: '', week: '', desc: '', color: '#3b82f6', pl: '' })}>+ Tambah</button></div>
        {safeRM.map((p, i) => (
          <div key={p.id} draggable onDragStart={e => onDragStart(e, i)} onDragOver={onDragOver} onDrop={e => onDrop(e, i)} onClick={() => setSel(p.id === sel ? null : p.id)} style={{ padding: '12px', borderRadius: 10, border: `1px solid ${sel === p.id ? 'var(--blue-border)' : 'var(--border)'}`, background: sel === p.id ? 'var(--blue-dim)' : draggedIdx === i ? 'var(--blue-dim)' : 'var(--surface2)', cursor: 'grab', display: 'flex', alignItems: 'center', gap: 8, transition: 'all 0.2s', opacity: draggedIdx === i ? 0.6 : 1 }}>
            <div style={{ width: 28, height: 28, borderRadius: 8, background: `${p.color || '#3b82f6'}15`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 800, color: p.color || '#3b82f6', flexShrink: 0 }}>{i + 1}</div>
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 13, fontWeight: 700, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title}</div><div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2, fontWeight: 600 }}>{(p.videos || []).length}v · {(p.casestudies || []).length}cs</div></div>
            <button className="icon-btn" style={{ width: 28, height: 28, flexShrink: 0, opacity: i > 0 ? 1 : 0.3 }} onClick={e => { e.stopPropagation(); movePhase(i, -1); }} disabled={i === 0} title="Pindah ke atas"><I n="chL" /></button>
            <button className="icon-btn" style={{ width: 28, height: 28, flexShrink: 0, opacity: i < safeRM.length - 1 ? 1 : 0.3 }} onClick={e => { e.stopPropagation(); movePhase(i, 1); }} disabled={i === safeRM.length - 1} title="Pindah ke bawah"><I n="chR" /></button>
            <button className="icon-btn" style={{ width: 28, height: 28, flexShrink: 0 }} onClick={e => { e.stopPropagation(); setEditPhase({ ...p }); }}><I n="pencil" /></button>
            <button className="icon-btn red" style={{ width: 28, height: 28, flexShrink: 0 }} onClick={e => { e.stopPropagation(); delPhase(p.id); }} title="Hapus"><I n="trash" /></button>
          </div>
        ))}
      </div>
      {sel && phase && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto', maxHeight: 500, paddingRight: 8 }}>
          <div className="between" style={{ paddingBottom: 16, borderBottom: '1px solid var(--border)' }}>
            <div><div style={{ fontSize: 18, fontWeight: 800, color: 'var(--text)' }}>{phase.title}</div><div style={{ fontSize: 13, color: 'var(--text2)', marginTop: 4, fontWeight: 600 }}>Week {phase.week}</div></div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn btn-blue" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => setEditItem({ isNew: true, isBulk: true })}><I n="sparkles" size={14} /> AI Bulk</button>
              <button className="icon-btn" onClick={() => { setEditPhase({ ...phase }); }}><I n="pencil" /></button>
              <button className="icon-btn red" onClick={() => delPhase(phase.id)} title="Hapus Modul"><I n="trash" /></button>
              <button className="icon-btn" onClick={() => setSel(null)}><I n="x" /></button>
            </div>
          </div>
          <div>
            <div className="between" style={{ marginBottom: 12 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Video ({(phase.videos || []).length})</span>
                <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => setEditItem({ isNew: true, type: 'video', title: '', url: '' })}>+ Tambah</button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {(phase.videos || []).map((v, i) => (
                <div key={v.id} style={{ padding: '10px 14px', borderRadius: 10, background: 'var(--surface)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ fontSize: 12, color: 'var(--text3)', fontWeight: 700, width: 20, flexShrink: 0 }}>{i + 1}</span>
                  <div style={{ flex: 1, fontSize: 13, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontWeight: 600 }}>{v.title}</div>
                  {v.url && <a href={v.url} target="_blank" rel="noopener" className="icon-btn" style={{ width: 28, height: 28, flexShrink: 0 }} onClick={e => e.stopPropagation()}><I n="play" /></a>}
                  <button className="icon-btn" style={{ width: 28, height: 28, flexShrink: 0 }} onClick={() => setEditItem({ isNew: false, type: 'video', index: i, id: v.id, title: v.title, url: v.url || '' })}><I n="pencil" /></button>
                  <button className="icon-btn red" style={{ width: 28, height: 28, flexShrink: 0 }} onClick={() => delItem('video', i)}><I n="trash" /></button>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div className="between" style={{ marginBottom: 12 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Projects ({(phase.casestudies || []).length})</span>
                <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => setEditItem({ isNew: true, type: 'case', title: '', desc: '' })}>+ Tambah</button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {(phase.casestudies || []).map((cs, i) => (
                <div key={cs.id} style={{ padding: '12px 14px', borderRadius: 10, background: 'var(--surface)', border: '1px solid var(--border)', display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                  <div style={{ flex: 1 }}><div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)', marginBottom: 4 }}>{cs.title}</div>{cs.desc && <div style={{ fontSize: 13, color: 'var(--text3)' }}>{cs.desc}</div>}</div>
                  <button className="icon-btn" style={{ width: 28, height: 28, flexShrink: 0 }} onClick={() => setEditItem({ isNew: false, type: 'case', index: i, id: cs.id, title: cs.title, desc: cs.desc || '' })}><I n="pencil" /></button>
                  <button className="icon-btn red" style={{ width: 28, height: 28, flexShrink: 0 }} onClick={() => delItem('case', i)}><I n="trash" /></button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      {editPhase && <Modal open={!!editPhase} onClose={() => setEditPhase(null)} title={editPhase.isNew ? 'Tambah Modul' : 'Edit Modul'}><PhaseForm init={editPhase} onSave={savePhase} onClose={() => setEditPhase(null)} /></Modal>}
      {editItem && <Modal open={!!editItem} onClose={() => setEditItem(null)} title={editItem.isBulk ? 'AI Bulk Import (Video & Tugas)' : editItem.isNew ? (editItem.type === 'video' ? 'Tambah Video' : 'Tambah Project') : (editItem.type === 'video' ? 'Edit Video' : 'Edit Project')}>
        {editItem.isBulk ? <BulkItemForm init={editItem} onSave={saveItem} onClose={() => setEditItem(null)} /> : <ItemForm init={editItem} onSave={saveItem} onClose={() => setEditItem(null)} />}
      </Modal>}
      {confirmDialog && (
        <Modal open={!!confirmDialog} onClose={() => setConfirmDialog(null)} title={confirmDialog.title}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div style={{ padding: '16px', background: 'rgba(225,29,72,0.1)', borderRadius: 12, fontSize: 14, color: 'var(--text2)', lineHeight: 1.6 }}>{confirmDialog.desc}</div>
            <div style={{ display: 'flex', gap: 12 }}>
              <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setConfirmDialog(null)}>Batal</button>
              <button className="btn btn-red" style={{ flex: 1 }} onClick={() => {
                if (confirmDialog.type === 'delete_phase') execDelPhase(confirmDialog.id);
                else if (confirmDialog.type === 'delete_item') execDelItem(confirmDialog.itemType, confirmDialog.index);
              }}>Hapus</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

const BulkItemForm = ({ init, onSave, onClose }) => {
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const sub = async e => {
    e.preventDefault();
    if (!text.trim()) return;
    setLoading(true); setErr('');
    
    const prompt = `Analisis teks berikut yang merupakan kumpulan daftar materi atau tugas/project pemrograman. Bedah teks tersebut menjadi format JSON murni.
    Aturan Kategori (type):
    - "video": Jika item tersebut terdengar seperti materi, teori, tontonan, atau mengandung URL.
    - "case": Jika item tersebut adalah soal tugas, project (contoh: "Sistem Manajemen Perpustakaan", "Mini Banking", dll), "Fitur Wajib", "Requirement", atau "Bonus".
    
    Format JSON Wajib (kembalikan hanya format array berikut):
    [
      {"type": "video", "title": "Nama Materi/Video", "url": "URL (jika ada, kosongkan jika tidak)"},
      {"type": "case", "title": "Judul Tugas/Project", "desc": "Penjelasan deskripsi atau daftar requirements"}
    ]
    
    Teks Mentah:
    ${text}`;

    const sys = "Kamu asisten sistem JSON data extractor yang efisien. Kembalikan HANYA JSON array murni tanpa blockquote ```json, tanpa penjelasan awal, dan tanpa teks akhir apa pun.";

    try {
      const res = await callFridayAI(prompt, sys);
      const parsed = JSON.parse(res.trim());
      if (!Array.isArray(parsed)) throw new Error("Format JSON dikembalikan salah");
      onSave({ ...init, bulkItems: parsed, isBulk: true });
    } catch (e) {
      setErr("Gagal diproses AI. Pastikan format teks tidak terlalu ambigu, atau hapus karakter aneh.");
      console.error(e);
    } finally {
      setLoading(false);
    }
  };

  return (
    <form onSubmit={sub} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {err && <div style={{ color: 'var(--red)', fontSize: 13, background: 'rgba(225,29,72,0.1)', padding: 12, borderRadius: 8 }}>{err}</div>}
      <div>
        <span className="label">Paste Daftar Tugas/Materi Mentah</span>
        <div style={{fontSize: 12, color: 'var(--text3)', marginBottom: 8}}>Friday AI akan otomatis membedah judul, merangkum requirement, dan membaginya jadi <strong style={{color:'var(--blue-hover)'}}>Video</strong> atau <strong style={{color:'var(--blue-hover)'}}>Project</strong>. Paste raw text secara frontal di bawah ini.</div>
        <textarea value={text} onChange={e => setText(e.target.value)} className="inp" style={{ minHeight: 220, whiteSpace: 'pre-wrap', lineHeight: 1.6 }} placeholder="Contoh:&#10;1. Sistem Manajemen Perpustakaan CLI&#10;Fitur Wajib: Tambah buku, Lihat semua, Cari...&#10;Bonus: Simpan data ke JSON.&#10;&#10;2. Pengenalan Pandas Fundamental&#10;[https://youtube.com/contoh-link](https://youtube.com/contoh-link)" required />
      </div>
      <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
        <button type="button" onClick={onClose} className="btn btn-ghost" style={{ flex: 1 }} disabled={loading}>Batal</button>

const WorkoutMgr = ({ workout, setWorkout }) => {
  const [activeDay, setActiveDay] = useState('Senin'); const [editEx, setEditEx] = useState(null); const [confirmDialog, setConfirmDialog] = useState(null);
  const safeWO = typeof workout === 'object' && !Array.isArray(workout) ? workout : DEFAULT_WORKOUT;
  const day = safeWO[activeDay] || { type: '', focus: '', exercises: [] };
  const saveMeta = (f, v) => setWorkout(p => ({ ...typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT, [activeDay]: { ...day, [f]: v } }));
  
  const saveEx = data => { 
    setWorkout(p => { 
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT; 
      const d = s[activeDay] || { exercises: [] }; 
      const list = d.exercises || []; 
      
      if (data.isBulk) {
        const newExs = (data.bulkItems || []).map(e => ({ name: e.name || 'Gerakan Tanpa Nama', detail: e.detail || '', target: e.target || '', category: 'primary' }));
        return { ...s, [activeDay]: { ...d, exercises: [...list, ...newExs] } };
      }
      
      if (data.isNew) return { ...s, [activeDay]: { ...d, exercises: [...list, { name: data.name, detail: data.detail, target: data.target, category: 'primary' }] } }; 
      return { ...s, [activeDay]: { ...d, exercises: list.map((e, i) => i === data.index ? { name: data.name, detail: data.detail, target: data.target, category: e.category } : e) } }; 
    }); 
    setEditEx(null); 
  };
  
  const delEx = i => { setConfirmDialog({ index: i, title: 'Hapus Gerakan?', desc: 'Latihan ini akan dihapus dari jadwal.' }); };
  const execDelEx = i => { 
    setWorkout(p => { 
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT; 
      const d = s[activeDay] || { exercises: [] }; 
      const list = [...(d.exercises || [])].filter(e => e.category === 'primary');
      list.splice(i, 1);
      return { ...s, [activeDay]: { ...d, exercises: list } };
    }); 
    setConfirmDialog(null);
  };
  const priEx = (day.exercises || []).filter(e => e.category === 'primary');
  
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{DAYS.map(d => <button key={d} className={`day-btn${activeDay === d ? ' on' : ''}`} onClick={() => setActiveDay(d)}>{d}</button>)}</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}><div><span className="label">Tipe Sesi</span><input value={day.type || ''} onChange={e => saveMeta('type', e.target.value)} className="inp" placeholder="Push Day..." /></div><div><span className="label">Fokus</span><input value={day.focus || ''} onChange={e => saveMeta('focus', e.target.value)} className="inp" placeholder="Dada, Bahu..." /></div></div>
      <div className="between" style={{ marginTop: 8 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Latihan ({priEx.length})</span>
        <div style={{display: 'flex', gap: 8}}>
            <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12, color: 'var(--blue-hover)' }} onClick={() => setEditEx({ isNew: true, isBulk: true, dayKey: activeDay })}><I n="sparkles" size={14} /> AI Bulk Import</button>
            <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => setEditEx({ isNew: true, index: -1, name: '', detail: '', target: '' })}>+ Tambah</button>
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 300, overflowY: 'auto' }}>
        {priEx.map((ex, i) => (
          <div key={i} style={{ padding: '12px 16px', borderRadius: 10, background: 'var(--surface)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ flex: 1 }}><div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)', marginBottom: 2 }}>{ex.name}</div><div style={{ fontSize: 12, color: 'var(--text3)', fontWeight: 500 }}>{ex.detail} — {ex.target}</div></div>
            <button className="icon-btn" onClick={() => setEditEx({ isNew: false, index: i, ...ex })}><I n="pencil" /></button>
            <button className="icon-btn red" onClick={() => delEx(i)}><I n="trash" /></button>
          </div>
        ))}
      </div>
      {editEx && <Modal open={!!editEx} onClose={() => setEditEx(null)} title={editEx.isBulk ? `AI Bulk Import Latihan — ${activeDay}` : editEx.isNew ? `Tambah Gerakan — ${activeDay}` : 'Edit Gerakan'}>
        {editEx.isBulk ? <BulkExForm init={editEx} onSave={saveEx} onClose={() => setEditEx(null)} /> : <ExForm init={editEx} onSave={saveEx} onClose={() => setEditEx(null)} />}
      </Modal>}
      {confirmDialog && (
        <Modal open={!!confirmDialog} onClose={() => setConfirmDialog(null)} title={confirmDialog.title}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div style={{ padding: '16px', background: 'rgba(225,29,72,0.1)', borderRadius: 12, fontSize: 14, color: 'var(--text2)', lineHeight: 1.6 }}>{confirmDialog.desc}</div>
            <div style={{ display: 'flex', gap: 12 }}>
              <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setConfirmDialog(null)}>Batal</button>
              <button className="btn btn-red" style={{ flex: 1 }} onClick={() => execDelEx(confirmDialog.index)}>Hapus</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

const BulkExForm = ({ init, onSave, onClose }) => {
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const sub = async e => {
    e.preventDefault();
    if (!text.trim()) return;
    setLoading(true); setErr('');
    
    const prompt = `Analisis teks jadwal latihan fisik/fitness berikut. Ekstrak menjadi format JSON murni array of objects.
    Aturan Kategori:
    - "name": Nama gerakan latihan (contoh: Bench Press, Squat, Push up).
    - "detail": Informasi set, repetisi, durasi, atau repetisi hingga failure (contoh: 3x12, 10 menit, To failure). Jika tidak ada, buatkan default logis (misal 3x10).
    - "target": Target otot utama (contoh: Dada, Kaki, Kardio). Jika tidak dicantumkan, tebak berdasarkan pengetahuan kebugaranmu.
    
    Format JSON Wajib (kembalikan hanya format array berikut):
    [
      {"name": "Nama Gerakan", "detail": "Set/Rep/Durasi", "target": "Target Otot"}
    ]
    
    Teks Mentah:
    ${text}`;

    const sys = "Kamu asisten AI Fitness JSON Extractor. Kembalikan HANYA JSON array murni tanpa blockquote ```json, tanpa penjelasan awal, dan tanpa teks akhir apa pun.";

    try {
      const res = await callFridayAI(prompt, sys);
      const parsed = JSON.parse(res.trim());
      if (!Array.isArray(parsed)) throw new Error("Format JSON dikembalikan salah");
      onSave({ ...init, bulkItems: parsed, isBulk: true });
    } catch (e) {
      setErr("Gagal diproses AI. Pastikan format teks bisa dipahami.");
      console.error(e);
    } finally {
      setLoading(false);
    }
  };

  return (
    <form onSubmit={sub} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {err && <div style={{ color: 'var(--red)', fontSize: 13, background: 'rgba(225,29,72,0.1)', padding: 12, borderRadius: 8 }}>{err}</div>}
      <div>
        <span className="label">Paste Daftar Latihan Fisik Mentah</span>
        <div style={{fontSize: 12, color: 'var(--text3)', marginBottom: 8}}>Friday akan otomatis mendeteksi nama gerakan, set/repetisi, dan mengkategorikan target otot. Paste daftar latihanmu di sini.</div>
        <textarea value={text} onChange={e => setText(e.target.value)} className="inp" style={{ minHeight: 220, whiteSpace: 'pre-wrap', lineHeight: 1.6 }} placeholder="Contoh:&#10;Incline Dumbell Press 3x10&#10;Cable Crossover 4 set 12 rep&#10;Tricep Pushdown 3x15 (failure)" required />
      </div>
      <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
        <button type="button" onClick={onClose} className="btn btn-ghost" style={{ flex: 1 }} disabled={loading}>Batal</button>
        <button type="submit" className="btn btn-blue" style={{ flex: 2 }} disabled={loading}>
          {loading ? <span className="spin-it"><I n="loader" /></span> : <I n="sparkles" />}
          {loading ? ' Memproses Jadwal Fisik...' : ' AI Eksekusi Import'}
        </button>
      </div>
    </form>
  );
};

const ToeflMgr = ({ toeflSched, setToeflSched }) => {
  const [activeDay, setActiveDay] = useState('Senin'); const [editTask, setEditTask] = useState(null); const [confirmDialog, setConfirmDialog] = useState(null);
  const safeSched = typeof toeflSched === 'object' && !Array.isArray(toeflSched) ? toeflSched : DEFAULT_TOEFL_SCHEDULE;
  const day = safeSched[activeDay] || { type: '', focus: '', tasks: [] };
  const saveMeta = (f, v) => setToeflSched(p => ({ ...typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_TOEFL_SCHEDULE, [activeDay]: { ...day, [f]: v } }));
  
  const saveTask = data => { 
    setToeflSched(p => { 
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_TOEFL_SCHEDULE; 
      const d = s[activeDay] || { tasks: [] }; 
      const list = d.tasks || []; 
      
      if (data.isBulk) {
        const newTasks = (data.bulkItems || []).map(t => ({ name: t.name || 'Task Tanpa Nama', detail: t.detail || '', time: t.time || '15m' }));
        return { ...s, [activeDay]: { ...d, tasks: [...list, ...newTasks] } };
      }
      
      if (data.isNew) return { ...s, [activeDay]: { ...d, tasks: [...list, { name: data.name, detail: data.detail, time: data.time }] } }; 
      return { ...s, [activeDay]: { ...d, tasks: list.map((t, i) => i === data.index ? { name: data.name, detail: data.detail, time: data.time } : t) } }; 
    }); 
    setEditTask(null); 
  };
  
  const delTask = i => { setConfirmDialog({ index: i, title: 'Hapus Task?', desc: 'Task belajar ini akan dihapus dari jadwal TOEFL.' }); };
  const execDelTask = i => { 
    setToeflSched(p => { 
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_TOEFL_SCHEDULE; 
      const d = s[activeDay] || { tasks: [] }; 
      const list = [...(d.tasks || [])]; 
      list.splice(i, 1); 
      return { ...s, [activeDay]: { ...d, tasks: list } }; 
    }); 
    setConfirmDialog(null);
  };
  const tasks = day.tasks || [];
  
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{DAYS.map(d => <button key={d} className={`day-btn${activeDay === d ? ' on' : ''}`} onClick={() => setActiveDay(d)}>{d}</button>)}</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}><div><span className="label">Fokus Section</span><input value={day.type || ''} onChange={e => saveMeta('type', e.target.value)} className="inp" placeholder="Listening Focus..." /></div><div><span className="label">Detail Sub-Fokus</span><input value={day.focus || ''} onChange={e => saveMeta('focus', e.target.value)} className="inp" placeholder="Note-taking..." /></div></div>
      <div className="between" style={{ marginTop: 8 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Task Belajar ({tasks.length})</span>
        <div style={{display: 'flex', gap: 8}}>
            <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12, color: 'var(--blue-hover)' }} onClick={() => setEditTask({ isNew: true, isBulk: true, dayKey: activeDay })}><I n="sparkles" size={14} /> AI Bulk Import</button>
            <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={() => setEditTask({ isNew: true, index: -1, name: '', detail: '', time: '' })}>+ Tambah</button>
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 300, overflowY: 'auto' }}>
        {tasks.map((t, i) => (
          <div key={i} style={{ padding: '12px 16px', borderRadius: 10, background: 'var(--surface)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ flex: 1 }}><div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)', marginBottom: 2 }}>{t.name}</div><div style={{ fontSize: 12, color: 'var(--text3)', fontWeight: 500 }}>{t.detail} — {t.time}</div></div>
            <button className="icon-btn" onClick={() => setEditTask({ isNew: false, index: i, ...t })}><I n="pencil" /></button>
            <button className="icon-btn red" onClick={() => delTask(i)}><I n="trash" /></button>
          </div>
        ))}
      </div>
      {editTask && <Modal open={!!editTask} onClose={() => setEditTask(null)} title={editTask.isBulk ? `AI Bulk Import TOEFL — ${activeDay}` : editTask.isNew ? `Tambah Task TOEFL — ${activeDay}` : 'Edit Task'}>
        {editTask.isBulk ? <BulkToeflTaskForm init={editTask} onSave={saveTask} onClose={() => setEditTask(null)} /> : <ToeflTaskForm init={editTask} onSave={saveTask} onClose={() => setEditTask(null)} />}
      </Modal>}
      {confirmDialog && (
        <Modal open={!!confirmDialog} onClose={() => setConfirmDialog(null)} title={confirmDialog.title}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div style={{ padding: '16px', background: 'rgba(225,29,72,0.1)', borderRadius: 12, fontSize: 14, color: 'var(--text2)', lineHeight: 1.6 }}>{confirmDialog.desc}</div>
            <div style={{ display: 'flex', gap: 12 }}>
              <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setConfirmDialog(null)}>Batal</button>
              <button className="btn btn-red" style={{ flex: 1 }} onClick={() => execDelTask(confirmDialog.index)}>Hapus</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};
