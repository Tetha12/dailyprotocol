// ─── TOEFL Schedule Page ──────────────────────────────────
const ToeflPage = ({ toeflSched, setToeflSched, toeflProg, setToeflProg, dayName, dateKey }) => {
  const defaultDay = TOEFL_DAYS.includes(dayName) ? dayName : 'Senin';
  const [selDay, setSelDay] = useState(defaultDay);
  const [editTask, setEditTask] = useState(null);
  const [editMeta, setEditMeta] = useState(false);

  const tKeyFor = (day, task) => `${dateKey}-${day}-${task.name}`;
  const isDoneFor = (day, task) => !!toeflProg[tKeyFor(day, task)];
  
  const toggleFor = (day, task) => setToeflProg(p => { 
    const s = safeObj(p); 
    const k = tKeyFor(day, task); 
    return { ...s, [k]: !s[k] }; 
  });
  
  const dayData = toeflSched[selDay] || { focus: '', tasks: [] };
  const tasks = dayData.tasks || [];
  const doneCount = tasks.filter(t => isDoneFor(selDay, t)).length;

  const saveMeta = (f, v) => setToeflSched(p => { 
    const s = safeObj(p); 
    const d = s[selDay] || { focus: '', tasks: [] }; 
    return { ...s, [selDay]: { ...d, [f]: v } }; 
  });
  
  const saveTask = data => { 
    setToeflSched(p => { 
      const s = safeObj(p); 
      const d = s[data.dayKey] || { focus: '', tasks: [] }; 
      const list = [...(d.tasks || [])]; 
      const nt = { name: data.name, detail: data.detail }; 
      if (data.isNew) {
        list.push(nt); 
      } else {
        list[data.index] = nt; 
      }
      return { ...s, [data.dayKey]: { ...d, tasks: list } }; 
    }); 
    setEditTask(null); 
  };
  
  const delTask = (day, idx) => { 
    if (!confirm('Hapus materi ini?')) return; 
    setToeflSched(p => { 
      const s = safeObj(p); 
      const d = s[day] || { tasks: [] }; 
      const list = [...(d.tasks || [])]; 
      list.splice(idx, 1); 
      return { ...s, [day]: { ...d, tasks: list } }; 
    }); 
  };

  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 800, margin: '0 auto' }}>
      <div className="between" style={{ flexWrap: 'wrap', gap: 12 }}>
        <div>
          <div style={{ fontSize: 24, fontWeight: 800, color: 'var(--text)', letterSpacing: '-0.02em', marginBottom: 4 }}>
            TOEFL Preparation
          </div>
          <div style={{ fontSize: 14, color: 'var(--text2)' }}>
            Jadwal Belajar 5 Hari Seminggu
          </div>
        </div>
      </div>
      
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ display: 'flex', gap: 10, overflowX: 'auto', paddingBottom: 8 }}>
          {TOEFL_DAYS.map(d => (
            <button 
              key={d} 
              className={`day-btn${selDay === d ? ' on' : ''}`} 
              onClick={() => setSelDay(d)} 
              style={{ flexShrink: 0, minWidth: 80 }}
            >
              {d}
              {d === dayName && (
                <span 
                  style={{
                    marginLeft: 6,
                    width: 6,
                    height: 6,
                    borderRadius: '50%',
                    background: 'var(--blue)',
                    display: 'inline-block'
                  }}
                />
              )}
            </button>
          ))}
        </div>
        
        <div className="card">
          <div className="between" style={{ marginBottom: 16, flexWrap: 'wrap', gap: 10 }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 4 }}>
                {selDay}
              </div>
              <div style={{ fontSize: 18, fontWeight: 700, color: 'var(--text)' }}>
                Fokus: {dayData.focus || 'Belum diatur'}
              </div>
            </div>
            <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 28, fontWeight: 800, color: 'var(--text)', lineHeight: 1 }}>
                  {doneCount}
                  <span style={{ fontSize: 14, color: 'var(--text3)', fontWeight: 600 }}>
                    &nbsp;/{tasks.length}
                  </span>
                </div>
              </div>
              {selDay === dayName && <span className="tag tag-blue">Hari Ini</span>}
              <button 
                className="icon-btn" 
                onClick={() => setEditMeta(p => p === selDay ? false : selDay)}
              >
                <I n="pencil" />
              </button>
            </div>
          </div>
          
          <PBar 
            cur={doneCount} 
            tot={tasks.length} 
            cls={doneCount === tasks.length && tasks.length > 0 ? "g" : ""} 
          />

          {editMeta === selDay && (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 12, marginBottom: 16, paddingTop: 16, marginTop: 16, borderTop: '1px solid var(--border)' }}>
              <div>
                <span className="label">Fokus Belajar Hari Ini</span>
                <input 
                  value={dayData.focus || ''} 
                  onChange={e => saveMeta('focus', e.target.value)} 
                  className="inp" 
                  placeholder="Contoh: Reading Comprehension..." 
                />
              </div>
            </div>
          )}
          
          <div style={{ marginTop: 24 }}>
            <button 
              className="btn btn-ghost" 
              style={{ marginBottom: 16 }} 
              onClick={() => setEditTask({ isNew: true, dayKey: selDay, name: '', detail: '' })}
            >
              <I n="plus" />Tambah Materi
            </button>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {tasks.map((task, i) => (
                <div 
                  key={i} 
                  className={`ex-card${isDoneFor(selDay, task) ? ' done' : ''}`} 
                  style={{ borderLeftColor: isDoneFor(selDay, task) ? 'var(--green)' : 'var(--blue)' }} 
                  onClick={() => toggleFor(selDay, task)}
                >
                  <div 
                    className="ex-num" 
                    style={isDoneFor(selDay, task) ? { background: 'var(--green-dim)', borderColor: 'var(--green)' } : {}}
                  >
                    {isDoneFor(selDay, task) ? <I n="check" size={14} /> : i + 1}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="ex-title">{task.name}</div>
                    <div className="ex-meta">{task.detail}</div>
                  </div>
                  <button 
                    className="icon-btn" 
                    onClick={e => {
                      e.stopPropagation();
                      setEditTask({ isNew: false, dayKey: selDay, index: i, ...task });
                    }}
                  >
                    <I n="pencil" />
                  </button>
                  <button 
                    className="icon-btn red" 
                    onClick={e => {
                      e.stopPropagation();
                      delTask(selDay, i);
                    }}
                  >
                    <I n="trash" />
                  </button>
                </div>
              ))}
            </div>
            {tasks.length === 0 && (
              <div style={{ fontSize: 14, color: 'var(--text3)', padding: '12px 0', textAlign: 'center' }}>
                Belum ada target materi untuk hari ini.
              </div>
            )}
          </div>
        </div>
      </div>
      
      <Modal 
        open={!!editTask} 
        onClose={() => setEditTask(null)} 
        title={editTask?.isNew ? `Tambah Materi — ${editTask?.dayKey}` : 'Edit Materi'}
      >
        {editTask && (
          <ToeflTaskForm 
            init={editTask} 
            onSave={saveTask} 
            onClose={() => setEditTask(null)} 
          />
        )}
      </Modal>
    </div>
  );
};

const ToeflTaskForm = ({ init, onSave, onClose }) => {
  const [name, setName] = useState(init.name || '');
  const [detail, setDetail] = useState(init.detail || '');
  
  const sub = e => {
    e.preventDefault();
    onSave({ ...init, name, detail });
  };
  
  return (
    <form onSubmit={sub} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div>
        <span className="label">Nama Materi / Tugas</span>
        <input 
          value={name} 
          onChange={e => setName(e.target.value)} 
          className="inp" 
          required 
          placeholder="Contoh: Practice Test Part A..." 
        />
      </div>
      <div>
        <span className="label">Detail / Durasi</span>
        <input 
          value={detail} 
          onChange={e => setDetail(e.target.value)} 
          className="inp" 
          required 
          placeholder="Contoh: 30 menit / 15 soal..." 
        />
      </div>
      <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
        <button type="button" onClick={onClose} className="btn btn-ghost" style={{ flex: 1 }}>
          Batal
        </button>
        <button type="submit" className="btn btn-blue" style={{ flex: 2 }}>
          Simpan
        </button>
      </div>
    </form>
  );
};

// ─── Diary & AI Page ──────────────────────────────────────
const DiaryPage = ({
  diary, setDiary, dateKey, fmtDate, safeHL, 
  safeExDone, today, weeklyAnalysis, setWeeklyAnalysis, 
  codeDone, totalCode, toeflProg, toeflSched
}) => {
  const [writing, setWriting] = useState(false);
  const [text, setText] = useState('');
  const [mood, setMood] = useState('neutral');
  const [editId, setEditId] = useState(null);
  const [showAll, setShowAll] = useState(false);
  
  // Tab control: daily vs weekly
  const [viewTab, setViewTab] = useState('daily');
  
  // AI States
  const [aiLoading, setAiLoading] = useState(false);
  const [aiDailyDraft, setAiDailyDraft] = useState(null);

  const todayEntry = diary.find(e => e.date === dateKey);
  
  // Hitung jumlah aktivitas toefl spesifik hari ini yang terceklist
  const todayToeflKeys = Object.keys(toeflProg).filter(k => k.startsWith(dateKey) && toeflProg[k]);
  const toeflToday = todayToeflKeys.length;

  const openNew = () => {
    if (todayEntry) {
      setEditId(todayEntry.id);
      setText(todayEntry.text);
      setMood(todayEntry.mood || 'neutral');
      setAiDailyDraft(todayEntry.aiAnalysis || null);
    } else {
      setText('');
      setMood('neutral');
      setEditId(null);
      setAiDailyDraft(null);
    }
    setWriting(true);
  };
  
  const save = () => {
    if (!text.trim()) return;
    
    if (editId) {
      setDiary(p => Array.isArray(p) ? p.map(e => e.id === editId ? { ...e, text: text.trim(), mood, aiAnalysis: aiDailyDraft } : e) : []);
    } else {
      const entry = { id: Date.now(), date: dateKey, dateLabel: fmtDate, text: text.trim(), mood, aiAnalysis: aiDailyDraft };
      setDiary(p => Array.isArray(p) ? [...p, entry] : [entry]);
    }
    setWriting(false);
    setText('');
    setEditId(null);
    setAiDailyDraft(null);
  };
  
  const deleteEntry = id => {
    if (!confirm('Hapus entri ini?')) return;
    setDiary(p => Array.isArray(p) ? p.filter(e => e.id !== id) : []);
  };
  
  const askFridayDaily = async () => {
    if (!text.trim()) { 
      alert('Tulis sesuatu dulu agar Friday bisa menganalisisnya.'); 
      return; 
    }
    setAiLoading(true);
    
    const prompt = `Ini adalah tulisan diary saya hari ini: "${text}". Mood saya: ${mood}. Progres hari ini: Roadmap Coding (${codeDone}/${totalCode} selesai secara keseluruhan), TOEFL (hari ini selesai ${toeflToday} tugas). Tolong baca dan pahami isi diary saya, berikan tanggapan yang empatik dan personal layaknya asisten Friday. Setelah itu, buatkan tabel HTML sederhana (gunakan <table>, <tr>, <th>, <td>) yang merangkum 'Fokus Utama' dan 'Saran Besok' menyertakan hasil evaluasi atas isi diary, roadmap, dan toefl hari ini.`;
    
    const sysIns = "Kamu adalah Friday, AI asisten personal cerdas. Output HANYA boleh dalam format HTML murni (<b>, <i>, <p>, <table>, <ul>, dsb). DILARANG KERAS menggunakan format Markdown seperti **, ###, atau asteris. Gunakan bahasa Indonesia yang elegan, profesional, dan empatik terhadap cerita pengguna.";
    
    const response = await callFridayAI(prompt, sysIns);
    setAiDailyDraft(response);
    setAiLoading(false);
  };

  const generateWeeklyAnalysis = async () => {
    setAiLoading(true);
    // Aggregate data
    let reportData = "Data 7 Hari Terakhir:\n\n";
    let toeflWeekly = 0;

    for (let i = 0; i < 7; i++) {
      const d = new Date(today); 
      d.setDate(today.getDate() - i);
      const k = d.toISOString().split('T')[0];
      const dayHabits = safeHL[k] ? HABITS.filter(h => safeHL[k][h.id]).length : 0;
      const diaryEn = diary.find(e => e.date === k);
      const moodText = diaryEn ? diaryEn.mood : 'Tidak ada catatan mood';
      const diaryText = diaryEn ? diaryEn.text : 'Tidak ada tulisan diary hari ini';
      
      const dayToefl = Object.keys(toeflProg).filter(key => key.startsWith(k) && toeflProg[key]).length;
      toeflWeekly += dayToefl;

      reportData += `- Tanggal: ${k} | Habits: ${dayHabits}/5 | TOEFL: ${dayToefl} tugas | Mood: ${moodText} | Isi Diary: "${diaryText}"\n`;
    }

    const toeflAllTime = Object.keys(toeflProg).filter(k => toeflProg[k]).length;
    reportData += `\nProgres Keseluruhan:\n- Roadmap Python: ${codeDone} dari ${totalCode} materi telah diselesaikan.\n- Total aktivitas TOEFL yang telah diselesaikan (selama protokol): ${toeflAllTime} tugas.\n\n`;

    reportData += "Tolong baca curhatan diary saya di atas. Buat laporan mingguan menggunakan tabel HTML (wajib ada <table>, <tr>, <th>, <td>) untuk merangkum performa per hari. Berikan insight mendalam mengenai pola tulisan diary saya, konsistensi kebiasaan, progres roadmap, persiapan TOEFL, dan tren emosi saya di bawah tabel tersebut. Ingat, hanya gunakan tag HTML murni, JANGAN gunakan Markdown sama sekali.";
    
    const sysIns = "Kamu adalah Friday, AI asisten personal. Kamu pandai menganalisa jurnal dan memberikan feedback membangun. Output WAJIB dalam format HTML murni. DILARANG menggunakan Markdown (seperti **, ###). Gunakan tabel HTML untuk menampilkan data agar rapi.";
    
    const response = await callFridayAI(reportData, sysIns);
    const newAnalysis = { id: Date.now(), date: dateKey, text: response };
    setWeeklyAnalysis(p => Array.isArray(p) ? [newAnalysis, ...p] : [newAnalysis]);
    setAiLoading(false);
  };

  const sorted = [...diary].reverse();
  const visible = showAll ? sorted : sorted.slice(0, 10);
  const moodColors = { good: 'var(--green)', neutral: 'var(--blue-hover)', bad: 'var(--red)' };
  const moodLabel = { good: 'Luar Biasa', neutral: 'Normal', bad: 'Berat' };

  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 800, margin: '0 auto' }}>
      <div className="between" style={{ flexWrap: 'wrap', gap: 16 }}>
        <div>
          <div style={{ fontSize: 24, fontWeight: 800, color: 'var(--text)', letterSpacing: '-0.02em', marginBottom: 4, display: 'flex', alignItems: 'center', gap: 10 }}>
            Diary & Friday AI <I n="sparkles" size={24} style={{ color: 'var(--blue)' }} />
          </div>
          <div style={{ fontSize: 14, color: 'var(--text2)' }}>
            Refleksi Harian & Analisis Cerdas
          </div>
        </div>
        <div style={{ display: 'flex', gap: 0, background: 'var(--surface)', borderRadius: 12, border: '1px solid var(--border)', overflow: 'hidden' }}>
          {[
            { id: 'daily', l: 'Catatan Harian' },
            { id: 'weekly', l: 'Analisis Mingguan' }
          ].map((v, vi) => (
            <button 
              key={v.id} 
              onClick={() => setViewTab(v.id)} 
              style={{
                padding: '10px 18px',
                border: 'none',
                borderRight: vi === 0 ? '1px solid var(--border)' : 'none',
                background: viewTab === v.id ? 'var(--blue-dim)' : 'transparent',
                color: viewTab === v.id ? 'var(--blue-hover)' : 'var(--text2)',
                fontWeight: 600,
                fontSize: 14,
                cursor: 'pointer',
                transition: 'all 0.2s'
              }}
            >
              {v.l}
            </button>
          ))}
        </div>
      </div>

      {viewTab === 'daily' && (
        <>
          <div className="between">
            <div style={{ fontSize: 14, color: 'var(--text3)', fontWeight: 600 }}>
              {diary.length} Entri Tersimpan
            </div>
            <button className="btn btn-blue" onClick={openNew}>
              <I n="pencil" />{todayEntry ? 'Edit Hari Ini' : 'Tulis Hari Ini'}
            </button>
          </div>
          
          {!todayEntry && (
            <div 
              className="card" 
              style={{
                borderStyle: 'dashed', 
                textAlign: 'center', 
                padding: '40px 20px', 
                background: 'var(--surface2)'
              }}
            >
              <I n="diary" size={40} style={{ color: 'var(--text3)', marginBottom: 16 }} />
              <div style={{ fontSize: 16, color: 'var(--text2)', marginBottom: 16, fontWeight: 500 }}>
                Belum ada refleksi untuk hari ini.
              </div>
              <button className="btn btn-blue" onClick={openNew}>
                <I n="pencil" />Mulai Menulis
              </button>
            </div>
          )}
          
          {visible.map(e => (
            <div key={e.id} className="diary-entry">
              <div className="between" style={{ marginBottom: 16 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <span className="diary-date" style={{ marginBottom: 0, fontSize: 14 }}>
                    {e.dateLabel || e.date}
                  </span>
                  {e.date === dateKey && <span className="tag tag-blue">Hari ini</span>}
                  {e.mood && (
                    <span 
                      style={{
                        padding: '4px 10px',
                        borderRadius: 6,
                        fontSize: 11,
                        fontWeight: 700,
                        background: `${moodColors[e.mood]}15`,
                        color: moodColors[e.mood],
                        border: `1px solid ${moodColors[e.mood]}30`
                      }}
                    >
                      {moodLabel[e.mood]}
                    </span>
                  )}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button 
                    className="icon-btn" 
                    onClick={() => {
                      setEditId(e.id);
                      setText(e.text);
                      setMood(e.mood || 'neutral');
                      setAiDailyDraft(e.aiAnalysis || null);
                      setWriting(true);
                    }}
                  >
                    <I n="pencil" />
                  </button>
                  <button 
                    className="icon-btn red" 
                    onClick={() => deleteEntry(e.id)}
                  >
                    <I n="trash" />
                  </button>
                </div>
              </div>
              <div className="diary-text">{e.text}</div>
              
              {e.aiAnalysis && (
                <div className="ai-box">
                  <div className="ai-header">
                    <I n="sparkles" size={16} /> Friday's Insight
                  </div>
                  <div className="ai-content">
                    {formatAIResponse(e.aiAnalysis)}
                  </div>
                </div>
              )}
            </div>
          ))}
          {diary.length > 10 && !showAll && (
            <button 
              className="btn btn-ghost" 
              style={{ width: '100%' }} 
              onClick={() => setShowAll(true)}
            >
              Tampilkan Semua Entri
            </button>
          )}
        </>
      )}

      {viewTab === 'weekly' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div 
            className="card card-p" 
            style={{
              textAlign: 'center', 
              background: 'linear-gradient(145deg, rgba(15, 23, 42, 0.6), rgba(30, 41, 59, 0.2))'
            }}
          >
            <I n="cpu" size={48} style={{ color: 'var(--blue)', marginBottom: 16 }} c="pulse-glow" />
            <h3 style={{ fontSize: 20, fontWeight: 800, marginBottom: 8 }}>
              Evaluasi Mingguan Bersama Friday
            </h3>
            <p style={{ fontSize: 14, color: 'var(--text2)', marginBottom: 20, maxWidth: 500, margin: '0 auto 20px' }}>
              Friday akan menganalisis data aktivitas, kebiasaan, dan jurnal Anda selama 7 hari terakhir untuk memberikan evaluasi komprehensif.
            </p>
            <button 
              className="btn btn-blue btn-lg" 
              onClick={generateWeeklyAnalysis} 
              disabled={aiLoading}
            >
              {aiLoading ? (
                <>
                  <span className="spin-it"><I n="loader" /></span> Menganalisis Data...
                </>
              ) : (
                <>
                  <I n="sparkles" />Hasilkan Laporan Mingguan
                </>
              )}
            </button>
          </div>

          {weeklyAnalysis.map((wa) => (
             <div key={wa.id} className="card card-p" style={{ borderColor: 'var(--blue-border)' }}>
               <div className="between" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 16 }}>
                 <div style={{ display: 'flex', alignItems: 'center', gap: 10, color: 'var(--blue-hover)', fontWeight: 700, fontSize: 16 }}>
                   <I n="cpu" size={20} /> Laporan: {wa.date}
                 </div>
               </div>
               <div className="ai-content" style={{ fontSize: 15 }}>
                 {formatAIResponse(wa.text)}
               </div>
             </div>
          ))}
          
          {weeklyAnalysis.length === 0 && !aiLoading && (
            <div style={{ textAlign: 'center', padding: '20px', color: 'var(--text3)' }}>
              Belum ada laporan mingguan.
            </div>
          )}
        </div>
      )}

      <Modal 
        open={writing} 
        onClose={() => setWriting(false)} 
        title={editId ? 'Edit Catatan' : 'Refleksi Hari Ini'} 
        wide
      >
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div style={{ fontSize: 14, color: 'var(--text2)', fontWeight: 500 }}>
            {fmtDate}
          </div>
          
          <div>
            <span className="label">Bagaimana perasaanmu hari ini?</span>
            <div style={{ display: 'flex', gap: 12 }}>
              {MOODS.map(m => (
                <button 
                  key={m.key} 
                  onClick={() => setMood(m.key)} 
                  style={{
                    flex: 1,
                    padding: '12px',
                    borderRadius: 12,
                    border: `2px solid ${mood === m.key ? m.color : 'var(--border)'}`,
                    background: mood === m.key ? m.color + '15' : 'var(--surface2)',
                    color: mood === m.key ? m.color : 'var(--text2)',
                    fontWeight: 600,
                    fontSize: 14,
                    cursor: 'pointer',
                    transition: 'all 0.2s'
                  }}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </div>
          
          <textarea 
            className="inp" 
            style={{ minHeight: 220, fontSize: 15, lineHeight: 1.7 }} 
            placeholder="Tulis kejadian penting, progres, atau kendala yang kamu hadapi hari ini..." 
            value={text} 
            onChange={e => setText(e.target.value)} 
            autoFocus
          />
          
          {aiDailyDraft && (
            <div className="ai-box">
              <div className="ai-header">
                <I n="sparkles" size={16} /> Friday's Insight
              </div>
              <div className="ai-content">
                {formatAIResponse(aiDailyDraft)}
              </div>
            </div>
          )}

          <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
            <button 
              className="btn btn-ghost" 
              style={{ padding: '12px' }} 
              onClick={askFridayDaily} 
              disabled={aiLoading || !text.trim()}
            >
              {aiLoading ? (
                <>
                  <span className="spin-it"><I n="loader" /></span> Menganalisis...
                </>
              ) : (
                <>
                  <I n="sparkles" /> Tanya Friday
                </>
              )}
            </button>
            <div style={{ flex: 1 }}></div>
            <button className="btn btn-ghost" onClick={() => setWriting(false)}>
              Batal
            </button>
            <button className="btn btn-blue" onClick={save} disabled={!text.trim() || aiLoading}>
              Simpan Catatan
            </button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ─── Fitness ──────────────────────────────────────────────
const FitnessPage = ({ safeWO, setWorkout, dayName, dateKey, safeExDone, setExDone, ws, fp, priEx, isExDone, toggleEx }) => {
  const [view, setView] = useState('today');
  const [selDay, setSelDay] = useState(dayName);
  const [editEx, setEditEx] = useState(null);
  const [editMeta, setEditMeta] = useState(false);
  
  const exKeyFor = (day, ex) => `${dateKey}-${day}-${ex.name}`;
  const isDoneFor = (day, ex) => !!safeExDone[exKeyFor(day, ex)];
  
  const toggleFor = (day, ex) => setExDone(p => {
    const s = safeObj(p);
    const k = exKeyFor(day, ex);
    return { ...s, [k]: !s[k] };
  });
  
  const saveEx = data => {
    setWorkout(p => {
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT;
      const day = s[data.dayKey] || { type: '', focus: '', exercises: [] };
      const list = [...(day.exercises || [])].filter(e => e.category === 'primary');
      const ne = { name: data.name, detail: data.detail, target: data.target, category: 'primary' };
      
      if (data.isNew) {
        list.push(ne);
      } else {
        list[data.index] = ne;
      }
      return { ...s, [data.dayKey]: { ...day, exercises: list } };
    });
    setEditEx(null);
  };
  
  const deleteEx = (day, idx) => {
    if (!confirm('Hapus?')) return;
    setWorkout(p => {
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT;
      const d = s[day] || { exercises: [] };
      const list = [...(d.exercises || [])].filter(e => e.category === 'primary');
      list.splice(idx, 1);
      return { ...s, [day]: { ...d, exercises: list } };
    });
  };
  
  const saveMeta = (day, f, v) => setWorkout(p => {
    const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT;
    const d = s[day] || { exercises: [] };
    return { ...s, [day]: { ...d, [f]: v } };
  });
  
  const priToday = (ws.exercises || []).filter(e => e.category === 'primary');
  const priDone = priToday.filter(e => isExDone(e)).length;
  const scapDone = SCAPULAR.filter(e => isExDone(e)).length;
  const totalDone = priDone + scapDone;
  const totalTot = priToday.length + SCAPULAR.length;
  
  const viewWS = safeWO[view === 'today' ? dayName : selDay] || { type: 'Rest', focus: '-', exercises: [] };
  const viewPri = (viewWS.exercises || []).filter(e => e.category === 'primary');
  
  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 800, margin: '0 auto' }}>
      <div className="between" style={{ flexWrap: 'wrap', gap: 16 }}>
        <div>
          <div style={{ fontSize: 24, fontWeight: 800, color: 'var(--text)', letterSpacing: '-0.02em', marginBottom: 4 }}>
            Fitness Protocol
          </div>
          <div style={{ fontSize: 14, color: 'var(--text2)' }}>
            Latihan Inti + Scapular Winging
          </div>
        </div>
        <div style={{ display: 'flex', gap: 0, background: 'var(--surface)', borderRadius: 12, border: '1px solid var(--border)', overflow: 'hidden' }}>
          {[
            { id: 'today', l: 'Hari Ini' },
            { id: 'weekly', l: 'Mingguan' }
          ].map((v, vi) => (
            <button 
              key={v.id} 
              onClick={() => setView(v.id)} 
              style={{
                padding: '10px 18px',
                border: 'none',
                borderRight: vi === 0 ? '1px solid var(--border)' : 'none',
                background: view === v.id ? 'var(--blue-dim)' : 'transparent',
                color: view === v.id ? 'var(--blue-hover)' : 'var(--text2)',
                fontWeight: 600,
                fontSize: 14,
                cursor: 'pointer',
                transition: 'all 0.2s'
              }}
            >
              {v.l}
            </button>
          ))}
        </div>
      </div>
      {view === 'today' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="card card-p">
            <div className="between" style={{ marginBottom: 16, flexWrap: 'wrap', gap: 10 }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 4 }}>
                  {dayName}
                </div>
                <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--text)' }}>
                  {ws.type} — {ws.focus}
                </div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontSize: 42, fontWeight: 800, color: 'var(--text)', lineHeight: 1 }}>
                  {totalDone}
                </div>
                <div style={{ fontSize: 14, color: 'var(--text3)', fontWeight: 600 }}>
                  / {totalTot}
                </div>
              </div>
            </div>
            <PBar cur={totalDone} tot={totalTot} />
            <div style={{ display: 'flex', gap: 16, marginTop: 12, fontSize: 13, color: 'var(--text2)', fontWeight: 500 }}>
              <span>Inti: <strong style={{ color: 'var(--text)' }}>{priDone}/{priToday.length}</strong></span>
              <span>Scapular: <strong style={{ color: 'var(--text)' }}>{scapDone}/{SCAPULAR.length}</strong></span>
            </div>
          </div>
          
          <div className="sep">
            <div className="sep-line" />
            <div className="sep-label">Latihan Inti</div>
            <div className="sep-line" />
          </div>
          
          <button 
            className="btn btn-ghost" 
            style={{ alignSelf: 'flex-start' }} 
            onClick={() => setEditEx({ isNew: true, dayKey: dayName, name: '', detail: '', target: '' })}
          >
            <I n="plus" />Tambah Latihan Inti
          </button>
          
          {priToday.length > 0 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {priToday.map((ex, i) => {
                const done = isExDone(ex);
                return (
                  <div 
                    key={i} 
                    className={`ex-card${done ? ' done' : ''}`} 
                    onClick={() => toggleEx(ex)}
                  >
                    <div className="ex-num">
                      {done ? <I n="check" size={14} /> : i + 1}
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="ex-title">{ex.name}</div>
                      <div className="ex-meta">{ex.detail} — {ex.target}</div>
                    </div>
                    <button 
                      className="icon-btn" 
                      onClick={e => {
                        e.stopPropagation();
                        setEditEx({ isNew: false, dayKey: dayName, index: i, ...ex });
                      }}
                    >
                      <I n="pencil" />
                    </button>
                  </div>
                );
              })}
            </div>
          )}
          
          <div className="sep">
            <div className="sep-line" />
            <div className="sep-label" style={{ color: 'var(--green)' }}>
              Terapi Scapular (Wajib)
            </div>
            <div className="sep-line" />
          </div>
          
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {SCAPULAR.map((ex, i) => {
              const done = isExDone(ex);
              return (
                <div 
                  key={i} 
                  className={`ex-card${done ? ' done' : ''}`} 
                  style={{ borderLeftColor: 'var(--green)' }} 
                  onClick={() => toggleEx(ex)}
                >
                  <div 
                    className="ex-num" 
                    style={{ borderColor: 'var(--green)', color: 'var(--green)' }}
                  >
                    {done ? <I n="check" size={14} /> : i + 1}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="ex-title">{ex.name}</div>
                    <div className="ex-meta">{ex.detail} — {ex.target}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      
      {view === 'weekly' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div style={{ display: 'flex', gap: 10, overflowX: 'auto', paddingBottom: 8 }}>
            {DAYS.map(d => (
              <button 
                key={d} 
                className={`day-btn${selDay === d ? ' on' : ''}`} 
                onClick={() => setSelDay(d)} 
                style={{ flexShrink: 0, minWidth: 80 }}
              >
                {d}
                {d === dayName && (
                  <span 
                    style={{
                      marginLeft: 6,
                      width: 6,
                      height: 6,
                      borderRadius: '50%',
                      background: 'var(--green)',
                      display: 'inline-block'
                    }}
                  />
                )}
              </button>
            ))}
          </div>
          <div className="card">
            <div className="between" style={{ marginBottom: 16, flexWrap: 'wrap', gap: 10 }}>
              <div>
                <div style={{ fontSize: 18, fontWeight: 700, color: 'var(--text)', marginBottom: 4 }}>
                  {selDay} — {viewWS.type}
                </div>
                <div style={{ fontSize: 14, color: 'var(--text2)' }}>
                  {viewWS.focus}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                {selDay === dayName && <span className="tag tag-green">Hari Ini</span>}
                <button 
                  className="icon-btn" 
                  onClick={() => setEditMeta(p => p === selDay ? false : selDay)}
                >
                  <I n="pencil" />
                </button>
              </div>
            </div>
            
            {editMeta === selDay && (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 20, paddingTop: 16, borderTop: '1px solid var(--border)' }}>
                <div>
                  <span className="label">Tipe Sesi</span>
                  <input 
                    value={viewWS.type || ''} 
                    onChange={e => saveMeta(selDay, 'type', e.target.value)} 
                    className="inp" 
                  />
                </div>
                <div>
                  <span className="label">Fokus</span>
                  <input 
                    value={viewWS.focus || ''} 
                    onChange={e => saveMeta(selDay, 'focus', e.target.value)} 
                    className="inp" 
                  />
                </div>
              </div>
            )}
            
            <button 
              className="btn btn-ghost" 
              style={{ marginBottom: 16 }} 
              onClick={() => setEditEx({ isNew: true, dayKey: selDay, name: '', detail: '', target: '' })}
            >
              <I n="plus" />Tambah Latihan
            </button>
            
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {viewPri.map((ex, i) => (
                <div 
                  key={i} 
                  className={`ex-card${isDoneFor(selDay, ex) ? ' done' : ''}`} 
                  onClick={() => toggleFor(selDay, ex)}
                >
                  <div className="ex-num">
                    {isDoneFor(selDay, ex) ? <I n="check" size={14} /> : i + 1}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="ex-title">{ex.name}</div>
                    <div className="ex-meta">{ex.detail}</div>
                  </div>
                  <button 
                    className="icon-btn" 
                    onClick={e => {
                      e.stopPropagation();
                      setEditEx({ isNew: false, dayKey: selDay, index: i, ...ex });
                    }}
                  >
                    <I n="pencil" />
                  </button>
                  <button 
                    className="icon-btn red" 
                    onClick={e => {
                      e.stopPropagation();
                      deleteEx(selDay, i);
                    }}
                  >
                    <I n="trash" />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      <Modal 
        open={!!editEx} 
        onClose={() => setEditEx(null)} 
        title={editEx?.isNew ? `Tambah Latihan — ${editEx?.dayKey}` : 'Edit Latihan'}
      >
        {editEx && (
          <ExForm 
            init={editEx} 
            onSave={saveEx} 
            onClose={() => setEditEx(null)} 
          />
        )}
      </Modal>
    </div>
  );
};

const ExForm = ({ init, onSave, onClose }) => {
  const [name, setName] = useState(init.name || '');
  const [detail, setDetail] = useState(init.detail || '');
  const [target, setTarget] = useState(init.target || '');
  
  const sub = e => {
    e.preventDefault();
    onSave({ ...init, name, detail, target, category: 'primary' });
  };
  
  return (
    <form onSubmit={sub} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div>
        <span className="label">Nama Gerakan</span>
        <input 
          value={name} 
          onChange={e => setName(e.target.value)} 
          className="inp" 
          required 
          placeholder="Bench Press..." 
        />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <span className="label">Set & Rep</span>
          <input 
            value={detail} 
            onChange={e => setDetail(e.target.value)} 
            className="inp" 
            required 
            placeholder="3 x 10–12" 
          />
        </div>
        <div>
          <span className="label">Target Otot</span>
          <input 
            value={target} 
            onChange={e => setTarget(e.target.value)} 
            className="inp" 
            required 
            placeholder="Dada..." 
          />
        </div>
      </div>
      <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
        <button type="button" onClick={onClose} className="btn btn-ghost" style={{ flex: 1 }}>
          Batal
        </button>
        <button type="submit" className="btn btn-blue" style={{ flex: 2 }}>
          Simpan
        </button>
      </div>
    </form>
  );
};

// ─── Roadmap ──────────────────────────────────────────────
const RoadmapPage = ({ safeRM, setRoadmap, safeRprog, toggleRprog, roadPhase, setRoadPhase, setSettTab, setSettOpen }) => {
  const active = safeRM.find(p => p.id === roadPhase);
  
  const totalAll = safeRM.reduce((a, p) => {
    return a + (p.videos || []).length + (p.casestudies || []).length;
  }, 0);
  
  const totalDone = Object.keys(safeRprog).filter(k => safeRprog[k]).length;
  
  return (
    <div className="fade-up">
      <div className="between" style={{ marginBottom: 20, flexWrap: 'wrap', gap: 16 }}>
        <div>
          <div style={{ fontSize: 24, fontWeight: 800, color: 'var(--text)', letterSpacing: '-0.02em', marginBottom: 4 }}>
            Python for Data Analytics
          </div>
          <div style={{ fontSize: 14, color: 'var(--text2)' }}>
            80 Hari Roadmap — {totalDone}/{totalAll} materi selesai
          </div>
        </div>
        <button 
          className="btn btn-ghost" 
          onClick={() => { setSettTab('roadmap'); setSettOpen(true); }}
        >
          <I n="settings" />Kelola Konten
        </button>
      </div>
      <div className="card card-p" style={{ marginBottom: 24 }}>
        <div className="between" style={{ marginBottom: 12 }}>
          <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--text2)' }}>
            Total Progress
          </span>
          <span style={{ fontSize: 18, fontWeight: 800, color: 'var(--blue-hover)' }}>
            {Math.round((totalDone / Math.max(totalAll, 1)) * 100)}%
          </span>
        </div>
        <PBar cur={totalDone} tot={totalAll} />
      </div>
      <div className="grid2">
        {safeRM.map((p, idx) => {
          const all = [...(p.videos || []).map(v => v.id), ...(p.casestudies || []).map(c => c.id)];
          const done = all.filter(id => safeRprog[id]).length;
          const pct = Math.round((done / (all.length || 1)) * 100);
          
          return (
            <div key={p.id} className="card" style={{ cursor: 'pointer' }} onClick={() => setRoadPhase(p.id)}>
              <div className="between" style={{ marginBottom: 20 }}>
                <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
                  <div 
                    style={{
                      width: 48,
                      height: 48,
                      borderRadius: 12,
                      background: `${p.color || '#3b82f6'}15`,
                      border: `1px solid ${p.color || '#3b82f6'}40`,
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      fontSize: 20,
                      fontWeight: 800,
                      color: p.color || '#3b82f6',
                      flexShrink: 0
                    }}
                  >
                    {idx + 1}
                  </div>
                  <div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: 'var(--text)', marginBottom: 4 }}>
                      {p.title}
                    </div>
                    <div style={{ fontSize: 13, color: 'var(--text3)', fontWeight: 500 }}>
                      Week {p.week} · {(p.videos || []).length}v {(p.casestudies || []).length}cs
                    </div>
                  </div>
                </div>
                <span style={{ fontSize: 24, fontWeight: 800, color: pct === 100 ? 'var(--green)' : 'var(--text3)' }}>
                  {pct}%
                </span>
              </div>
              <PBar cur={done} tot={all.length} />
              <div style={{ fontSize: 13, color: 'var(--text2)', marginTop: 12, fontWeight: 500 }}>
                {done}/{all.length} — {p.desc}
              </div>
            </div>
          );
        })}
      </div>

      <Modal open={!!active} onClose={() => setRoadPhase(null)} title={active?.title || ''} wide>
        {active && (() => {
          const pvids = active.videos || [];
          const pcases = active.casestudies || [];
          
          return (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
              {active.pl && (
                <a 
                  href={active.pl} 
                  target="_blank" 
                  rel="noopener" 
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    padding: '16px 20px',
                    background: `${active.color || '#3b82f6'}10`,
                    border: `1px solid ${active.color || '#3b82f6'}30`,
                    borderRadius: 'var(--radius-sm)',
                    textDecoration: 'none',
                    color: 'var(--text)',
                    transition: 'all 0.2s'
                  }}
                >
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700 }}>Buka Playlist YouTube</div>
                    <div style={{ fontSize: 13, color: 'var(--text2)', marginTop: 4 }}>
                      {pvids.length} video · {pcases.length} project
                    </div>
                  </div>
                  <I n="play" size={20} />
                </a>
              )}
              <p style={{ fontSize: 14, color: 'var(--text2)', lineHeight: 1.7 }}>
                {active.desc}
              </p>
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 12 }}>
                  Video ({pvids.filter(v => safeRprog[v.id]).length}/{pvids.length})
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 300, overflowY: 'auto' }}>
                  {pvids.map((v, i) => {
                    const done = safeRprog[v.id];
                    return (
                      <div 
                        key={v.id} 
                        style={{
                          display: 'flex',
                          alignItems: 'center',
                          gap: 12,
                          padding: '12px 16px',
                          borderRadius: 10,
                          border: `1px solid ${done ? 'var(--blue-border)' : 'var(--border)'}`,
                          background: done ? 'var(--blue-dim)' : 'var(--surface2)',
                          cursor: 'pointer',
                          transition: 'all 0.2s'
                        }} 
                        onClick={() => toggleRprog(v.id)}
                      >
                        <div 
                          style={{
                            width: 20,
                            height: 20,
                            borderRadius: 6,
                            border: `2px solid ${done ? 'var(--blue)' : 'var(--text3)'}`,
                            background: done ? 'var(--blue)' : 'transparent',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            flexShrink: 0
                          }}
                        >
                          {done && <I n="check" size={12} style={{ color: 'white' }} />}
                        </div>
                        <div 
                          style={{
                            flex: 1,
                            fontSize: 14,
                            fontWeight: 600,
                            color: done ? 'var(--text3)' : 'var(--text)',
                            textDecoration: done ? 'line-through' : 'none'
                          }}
                        >
                          {i + 1}. {v.title}
                        </div>
                        {v.url && (
                          <a 
                            href={v.url} 
                            target="_blank" 
                            rel="noopener" 
                            className="icon-btn" 
                            onClick={e => e.stopPropagation()} 
                            style={{ flexShrink: 0 }}
                          >
                            <I n="play" />
                          </a>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
              {pcases.length > 0 && (
                <div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 12 }}>
                    Projects ({pcases.filter(c => safeRprog[c.id]).length}/{pcases.length})
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {pcases.map(cs => {
                      const done = safeRprog[cs.id];
                      return (
                        <div 
                          key={cs.id} 
                          style={{
                            display: 'flex',
                            alignItems: 'flex-start',
                            gap: 12,
                            padding: '12px 16px',
                            borderRadius: 10,
                            border: `1px solid ${done ? 'var(--blue-border)' : 'var(--border)'}`,
                            background: done ? 'var(--blue-dim)' : 'var(--surface2)',
                            cursor: 'pointer',
                            transition: 'all 0.2s'
                          }} 
                          onClick={() => toggleRprog(cs.id)}
                        >
                          <div 
                            style={{
                              width: 20,
                              height: 20,
                              borderRadius: 6,
                              border: `2px solid ${done ? 'var(--blue)' : 'var(--text3)'}`,
                              background: done ? 'var(--blue)' : 'transparent',
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'center',
                              flexShrink: 0,
                              marginTop: 2
                            }}
                          >
                            {done && <I n="check" size={12} style={{ color: 'white' }} />}
                          </div>
                          <div>
                            <div 
                              style={{
                                fontSize: 14,
                                fontWeight: 600,
                                color: done ? 'var(--text3)' : 'var(--text)',
                                textDecoration: done ? 'line-through' : 'none',
                                marginBottom: 4
                              }}
                            >
                              {cs.title}
                            </div>
                            <div style={{ fontSize: 13, color: 'var(--text2)' }}>
                              {cs.desc}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })()}
      </Modal>
    </div>
  );
};

// ─── Roadmap Manager ──────────────────────────────────────
const RoadmapMgr = ({ roadmap, setRoadmap }) => {
  const [sel, setSel] = useState(null);
  const [editPhase, setEditPhase] = useState(null);
  const [editItem, setEditItem] = useState(null);
  
  const safeRM = Array.isArray(roadmap) ? roadmap : DEFAULT_ROADMAP;
  const phase = safeRM.find(p => p.id === sel);

  const savePhase = d => {
    if (d.isNew) {
      const np = { 
        id: `ph_${Date.now()}`, 
        title: d.title, 
        week: d.week, 
        desc: d.desc, 
        color: d.color || '#3b82f6', 
        pl: d.pl, 
        videos: [], 
        casestudies: [] 
      };
      setRoadmap(p => {
        const s = Array.isArray(p) ? p : DEFAULT_ROADMAP;
        return [...s, np];
      });
    } else {
      setRoadmap(p => {
        const s = Array.isArray(p) ? p : DEFAULT_ROADMAP;
        return s.map(x => x.id === d.id ? { ...x, ...d } : x);
      });
    }
    setEditPhase(null);
  };
  
  const delPhase = id => {
    if (!confirm('Hapus modul ini?')) return;
    setRoadmap(p => {
      const s = Array.isArray(p) ? p : DEFAULT_ROADMAP;
      return s.filter(x => x.id !== id);
    });
    if (sel === id) setSel(null);
  };
  
  const saveItem = data => {
    setRoadmap(p => {
      const s = Array.isArray(p) ? p : DEFAULT_ROADMAP;
      return s.map(ph => {
        if (ph.id !== sel) return ph;
        const key = data.type === 'video' ? 'videos' : 'casestudies';
        const list = [...(ph[key] || [])];
        const item = data.type === 'video' 
          ? { id: data.id || `v_${Date.now()}`, title: data.title, url: data.url || '' } 
          : { id: data.id || `cs_${Date.now()}`, title: data.title, desc: data.desc || '' };
          
        if (data.isNew) {
          list.push(item);
        } else {
          list[data.index] = item;
        }
        return { ...ph, [key]: list };
      });
    });
    setEditItem(null);
  };
  
  const delItem = (type, index) => {
    if (!confirm('Hapus item?')) return;
    setRoadmap(p => {
      const s = Array.isArray(p) ? p : DEFAULT_ROADMAP;
      return s.map(ph => {
        if (ph.id !== sel) return ph;
        const key = type === 'video' ? 'videos' : 'casestudies';
        const list = [...(ph[key] || [])];
        list.splice(index, 1);
        return { ...ph, [key]: list };
      });
    });
  };

  return (
    <div style={{ display: 'grid', gridTemplateColumns: sel ? '240px 1fr' : '1fr', gap: 20, minHeight: 400 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div className="between" style={{ marginBottom: 8 }}>
          <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
            Modul Belajar
          </span>
          <button 
            className="btn btn-ghost" 
            style={{ padding: '6px 12px', fontSize: 12 }} 
            onClick={() => setEditPhase({ isNew: true, title: '', week: '', desc: '', color: '#3b82f6', pl: '' })}
          >
            + Tambah
          </button>
        </div>
        {safeRM.map((p, i) => (
          <div 
            key={p.id} 
            onClick={() => setSel(p.id === sel ? null : p.id)} 
            style={{
              padding: '12px',
              borderRadius: 10,
              border: `1px solid ${sel === p.id ? 'var(--blue-border)' : 'var(--border)'}`,
              background: sel === p.id ? 'var(--blue-dim)' : 'var(--surface2)',
              cursor: 'pointer',
              display: 'flex',
              alignItems: 'center',
              gap: 12,
              transition: 'all 0.2s'
            }}
          >
            <div 
              style={{
                width: 28,
                height: 28,
                borderRadius: 8,
                background: `${p.color || '#3b82f6'}15`,
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: 13,
                fontWeight: 800,
                color: p.color || '#3b82f6',
                flexShrink: 0
              }}
            >
              {i + 1}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {p.title}
              </div>
              <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>
                {(p.videos || []).length}v · {(p.casestudies || []).length}cs
              </div>
            </div>
            <button 
              className="icon-btn" 
              style={{ width: 28, height: 28, flexShrink: 0 }} 
              onClick={e => {
                e.stopPropagation();
                setEditPhase({ ...p });
              }}
            >
              <I n="pencil" />
            </button>
          </div>
        ))}
      </div>
      {sel && phase && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto', maxHeight: 500, paddingRight: 8 }}>
          <div className="between">
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: 'var(--text)' }}>
                {phase.title}
              </div>
              <div style={{ fontSize: 13, color: 'var(--text2)', marginTop: 4 }}>
                Week {phase.week}
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="icon-btn red" onClick={() => delPhase(phase.id)}>
                <I n="trash" />
              </button>
              <button className="icon-btn" onClick={() => setSel(null)}>
                <I n="x" />
              </button>
            </div>
          </div>
          <div>
            <div className="between" style={{ marginBottom: 12 }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                Video ({(phase.videos || []).length})
              </span>
              <button 
                className="btn btn-ghost" 
                style={{ padding: '6px 12px', fontSize: 12 }} 
                onClick={() => setEditItem({ isNew: true, type: 'video', title: '', url: '' })}
              >
                + Tambah
              </button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {(phase.videos || []).map((v, i) => (
                <div 
                  key={v.id} 
                  style={{
                    padding: '10px 14px',
                    borderRadius: 10,
                    background: 'var(--surface)',
                    border: '1px solid var(--border)',
                    display: 'flex',
                    alignItems: 'center',
                    gap: 10
                  }}
                >
                  <span style={{ fontSize: 12, color: 'var(--text3)', fontWeight: 600, width: 20, flexShrink: 0 }}>
                    {i + 1}
                  </span>
                  <div style={{ flex: 1, fontSize: 13, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontWeight: 500 }}>
                    {v.title}
                  </div>
                  {v.url && (
                    <a 
                      href={v.url} 
                      target="_blank" 
                      rel="noopener" 
                      className="icon-btn" 
                      style={{ width: 28, height: 28, flexShrink: 0 }} 
                      onClick={e => e.stopPropagation()}
                    >
                      <I n="play" />
                    </a>
                  )}
                  <button 
                    className="icon-btn" 
                    style={{ width: 28, height: 28, flexShrink: 0 }} 
                    onClick={() => setEditItem({ isNew: false, type: 'video', index: i, id: v.id, title: v.title, url: v.url || '' })}
                  >
                    <I n="pencil" />
                  </button>
                  <button 
                    className="icon-btn red" 
                    style={{ width: 28, height: 28, flexShrink: 0 }} 
                    onClick={() => delItem('video', i)}
                  >
                    <I n="trash" />
                  </button>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div className="between" style={{ marginBottom: 12 }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                Projects ({(phase.casestudies || []).length})
              </span>
              <button 
                className="btn btn-ghost" 
                style={{ padding: '6px 12px', fontSize: 12 }} 
                onClick={() => setEditItem({ isNew: true, type: 'case', title: '', desc: '' })}
              >
                + Tambah
              </button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {(phase.casestudies || []).map((cs, i) => (
                <div 
                  key={cs.id} 
                  style={{
                    padding: '12px 14px',
                    borderRadius: 10,
                    background: 'var(--surface)',
                    border: '1px solid var(--border)',
                    display: 'flex',
                    alignItems: 'flex-start',
                    gap: 10
                  }}
                >
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text)', marginBottom: 4 }}>
                      {cs.title}
                    </div>
                    {cs.desc && <div style={{ fontSize: 13, color: 'var(--text3)' }}>{cs.desc}</div>}
                  </div>
                  <button 
                    className="icon-btn" 
                    style={{ width: 28, height: 28, flexShrink: 0 }} 
                    onClick={() => setEditItem({ isNew: false, type: 'case', index: i, id: cs.id, title: cs.title, desc: cs.desc || '' })}
                  >
                    <I n="pencil" />
                  </button>
                  <button 
                    className="icon-btn red" 
                    style={{ width: 28, height: 28, flexShrink: 0 }} 
                    onClick={() => delItem('case', i)}
                  >
                    <I n="trash" />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      {editPhase && (
        <Modal 
          open={!!editPhase} 
          onClose={() => setEditPhase(null)} 
          title={editPhase.isNew ? 'Tambah Modul' : 'Edit Modul'}
        >
          <PhaseForm 
            init={editPhase} 
            onSave={savePhase} 
            onClose={() => setEditPhase(null)} 
          />
        </Modal>
      )}
      {editItem && (
        <Modal 
          open={!!editItem} 
          onClose={() => setEditItem(null)} 
          title={editItem.isNew ? (editItem.type === 'video' ? 'Tambah Video' : 'Tambah Project') : (editItem.type === 'video' ? 'Edit Video' : 'Edit Project')}
        >
          <ItemForm 
            init={editItem} 
            onSave={saveItem} 
            onClose={() => setEditItem(null)} 
          />
        </Modal>
      )}
    </div>
  );
};

const ItemForm = ({ init, onSave, onClose }) => {
  const [title, setTitle] = useState(init.title || '');
  const [url, setUrl] = useState(init.url || '');
  const [desc, setDesc] = useState(init.desc || '');
  
  const sub = e => {
    e.preventDefault();
    onSave({ ...init, title, url, desc });
  };
  
  return (
    <form onSubmit={sub} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div>
        <span className="label">Judul</span>
        <input 
          value={title} 
          onChange={e => setTitle(e.target.value)} 
          className="inp" 
          required 
          placeholder={init.type === 'video' ? '#01 — Intro Python...' : 'Project: Data Analysis...'} 
        />
      </div>
      {init.type === 'video' && (
        <div>
          <span className="label">YouTube URL (opsional)</span>
          <input 
            value={url} 
            onChange={e => setUrl(e.target.value)} 
            className="inp" 
            placeholder="https://youtube.com/..." 
          />
        </div>
      )}
      {init.type === 'case' && (
        <div>
          <span className="label">Deskripsi Project</span>
          <textarea 
            value={desc} 
            onChange={e => setDesc(e.target.value)} 
            className="inp" 
            style={{ minHeight: 90 }} 
            placeholder="Buat analisis data..." 
          />
        </div>
      )}
      <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
        <button type="button" onClick={onClose} className="btn btn-ghost" style={{ flex: 1 }}>
          Batal
        </button>
        <button type="submit" className="btn btn-blue" style={{ flex: 2 }}>
          Simpan
        </button>
      </div>
    </form>
  );
};

const PhaseForm = ({ init, onSave, onClose }) => {
  const [title, setTitle] = useState(init.title || '');
  const [week, setWeek] = useState(init.week || '');
  const [desc, setDesc] = useState(init.desc || '');
  const [color, setColor] = useState(init.color || '#3b82f6');
  const [pl, setPl] = useState(init.pl || '');
  
  const cols = ['#3b82f6', '#0ea5e9', '#6366f1', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6'];
  
  return (
    <form 
      onSubmit={e => {
        e.preventDefault();
        onSave({ ...init, title, week, desc, color, pl });
      }} 
      style={{ display: 'flex', flexDirection: 'column', gap: 16 }}
    >
      <div>
        <span className="label">Nama Modul</span>
        <input 
          value={title} 
          onChange={e => setTitle(e.target.value)} 
          className="inp" 
          required 
        />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <span className="label">Week</span>
          <input 
            value={week} 
            onChange={e => setWeek(e.target.value)} 
            className="inp" 
            placeholder="1–2" 
          />
        </div>
        <div>
          <span className="label">Playlist URL</span>
          <input 
            value={pl} 
            onChange={e => setPl(e.target.value)} 
            className="inp" 
          />
        </div>
      </div>
      <div>
        <span className="label">Deskripsi</span>
        <textarea 
          value={desc} 
          onChange={e => setDesc(e.target.value)} 
          className="inp" 
          style={{ minHeight: 80 }} 
        />
      </div>
      <div>
        <span className="label">Warna Tema</span>
        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
          {cols.map(c => (
            <div 
              key={c} 
              onClick={() => setColor(c)} 
              style={{
                width: 32,
                height: 32,
                borderRadius: 10,
                background: c,
                cursor: 'pointer',
                border: `2px solid ${color === c ? '#fff' : 'transparent'}`,
                transform: color === c ? 'scale(1.15)' : 'scale(1)',
                transition: 'all 0.2s', 
                boxShadow: color === c ? `0 0 10px ${c}` : 'none'
              }}
            />
          ))}
        </div>
      </div>
      <div style={{ display: 'flex', gap: 12, marginTop: 8 }}>
        <button type="button" onClick={onClose} className="btn btn-ghost" style={{ flex: 1 }}>
          Batal
        </button>
        <button type="submit" className="btn btn-blue" style={{ flex: 2 }}>
          Simpan
        </button>
      </div>
    </form>
  );
};

// ─── Workout Manager ──────────────────────────────────────
const WorkoutMgr = ({ workout, setWorkout }) => {
  const [activeDay, setActiveDay] = useState('Senin');
  const [editEx, setEditEx] = useState(null);
  
  const safeWO = typeof workout === 'object' && !Array.isArray(workout) ? workout : DEFAULT_WORKOUT;
  const day = safeWO[activeDay] || { type: '', focus: '', exercises: [] };
  
  const saveMeta = (f, v) => setWorkout(p => {
    const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT;
    return { ...s, [activeDay]: { ...day, [f]: v } };
  });
  
  const saveEx = data => {
    setWorkout(p => {
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT;
      const d = s[activeDay] || { exercises: [] };
      const list = d.exercises || [];
      
      if (data.isNew) {
        return {
          ...s,
          [activeDay]: {
            ...d,
            exercises: [...list, { name: data.name, detail: data.detail, target: data.target, category: 'primary' }]
          }
        };
      }
      
      return {
        ...s,
        [activeDay]: {
          ...d,
          exercises: list.map((e, i) => i === data.index ? { name: data.name, detail: data.detail, target: data.target, category: e.category } : e)
        }
      };
    });
    setEditEx(null);
  };
  
  const delEx = i => {
    if (!confirm('Hapus?')) return;
    setWorkout(p => {
      const s = typeof p === 'object' && !Array.isArray(p) ? p : DEFAULT_WORKOUT;
      const d = s[activeDay] || { exercises: [] };
      const list = [...(d.exercises || [])];
      list.splice(i, 1);
      return { ...s, [activeDay]: { ...d, exercises: list } };
    });
  };
  
  const priEx = (day.exercises || []).filter(e => e.category === 'primary');
  
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {DAYS.map(d => (
          <button 
            key={d} 
            className={`day-btn${activeDay === d ? ' on' : ''}`} 
            onClick={() => setActiveDay(d)}
          >
            {d}
          </button>
        ))}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <span className="label">Tipe Sesi</span>
          <input 
            value={day.type || ''} 
            onChange={e => saveMeta('type', e.target.value)} 
            className="inp" 
            placeholder="Push Day..." 
          />
        </div>
        <div>
          <span className="label">Fokus</span>
          <input 
            value={day.focus || ''} 
            onChange={e => saveMeta('focus', e.target.value)} 
            className="inp" 
            placeholder="Dada, Bahu..." 
          />
        </div>
      </div>
      <div className="between" style={{ marginTop: 8 }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
          Latihan ({priEx.length})
        </span>
        <button 
          className="btn btn-ghost" 
          style={{ padding: '6px 12px', fontSize: 12 }} 
          onClick={() => setEditEx({ isNew: true, index: -1, name: '', detail: '', target: '' })}
        >
          + Tambah
        </button>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 300, overflowY: 'auto' }}>
        {priEx.map((ex, i) => (
          <div 
            key={i} 
            style={{
              padding: '12px 16px',
              borderRadius: 10,
              background: 'var(--surface)',
              border: '1px solid var(--border)',
              display: 'flex',
              alignItems: 'center',
              gap: 12
            }}
          >
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text)', marginBottom: 2 }}>
                {ex.name}
              </div>
              <div style={{ fontSize: 12, color: 'var(--text3)' }}>
                {ex.detail} — {ex.target}
              </div>
            </div>
            <button 
              className="icon-btn" 
              onClick={() => setEditEx({ isNew: false, index: i, ...ex })}
            >
              <I n="pencil" />
            </button>
            <button 
              className="icon-btn red" 
              onClick={() => delEx(i)}
            >
              <I n="trash" />
            </button>
          </div>
        ))}
      </div>
      {editEx && (
        <Modal 
          open={!!editEx} 
          onClose={() => setEditEx(null)} 
          title={editEx.isNew ? 'Tambah Gerakan' : 'Edit Gerakan'}
        >
          <ExForm 
            init={editEx} 
            onSave={saveEx} 
            onClose={() => setEditEx(null)} 
          />
        </Modal>
      )}
    </div>
  );
};

// Render the application
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
